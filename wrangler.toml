name = "audius-links"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "3811365464a8e56b2b27a5590e328e49"
assets = { directory = "public", binding = "ASSETS" }
workers_dev = true

# Page content, uploaded images and the Instagram token. No id: the first
# production deploy creates the namespace and reuses it after that.
kv_namespaces = [{ binding = "LINKS_KV" }]

# Serves audius.co/links ahead of the main web worker (more specific route wins).
# Uncomment once approved:
# routes = [
#   { pattern = "audius.co/links", zone_name = "audius.co" },
#   { pattern = "audius.co/links/*", zone_name = "audius.co" }
# ]

# Not secrets. IG_APP_SECRET is a Worker secret set in the Cloudflare dashboard.
# Admin stays locked until ACCESS_AUD is set to the Access application's AUD tag.
[vars]
ACCESS_TEAM_DOMAIN = "faucet-61o-pages.cloudflareaccess.com"
ACCESS_AUD = ""
IG_APP_ID = ""

# Instagram sync
[triggers]
crons = ["*/30 * * * *"]

# Per-branch preview builds. Previews don't inherit top-level bindings or vars.
# Without a LINKS_KV binding here, previews render links.json read-only.
[previews]
vars = { KV_PREFIX = "preview:", ACCESS_TEAM_DOMAIN = "faucet-61o-pages.cloudflareaccess.com", ACCESS_AUD = "" }
